plugins { id 'com.android.application' }

android {
    namespace 'br.com.mbalabs.calda'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.mbalabs.calda'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '5.1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}