name: MBA Escola - migrar banco central

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mba-escola-db-migrate.yml'
      - 'infra/supabase/migrations/20260825170000_mba_escola_central.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar credenciais configuradas
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase GitHub secrets not configured."
            exit 2
          fi
          echo "Supabase GitHub secrets are configured."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preparar migration canônica
        run: |
          mkdir -p supabase/migrations
          cp infra/supabase/migrations/20260825170000_mba_escola_central.sql supabase/migrations/20260825170000_mba_escola_central.sql

      - name: Vincular Supabase central
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref jrbkojhnltqfqwpczwuw --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --include-all
