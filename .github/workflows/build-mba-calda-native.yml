name: MBA Calda APK nativo
on:
  push:
    branches:
      - mba-calda-native-android
    paths:
      - 'mba-calda-nativo/**'
      - '.github/workflows/build-mba-calda-native.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply MBA Calda v3 native UI and icon
        run: |
          base64 -d mba-calda-nativo/build_src_v3.tar.xz.b64 | tar -xJ -C mba-calda-nativo
          grep -q "versionCode 3" mba-calda-nativo/app/build.gradle
          sed -i '8,9d' mba-calda-nativo/app/src/main/AndroidManifest.xml
          python3 -c "import xml.etree.ElementTree as E; E.parse('mba-calda-nativo/app/src/main/AndroidManifest.xml')"
      - name: Build native APK
        working-directory: mba-calda-nativo
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MBA-Calda-Nativo-APK
          path: mba-calda-nativo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
