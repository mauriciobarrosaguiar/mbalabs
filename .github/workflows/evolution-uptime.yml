# Consulta externa leve para reduzir o spin-down da Evolution API em Render Free.
# A agenda somente funciona depois que este workflow estiver na branch padrão.
# Não envia mensagens, não conecta/desconecta instâncias e não usa API keys.
# Atenção: GitHub Actions pode atrasar/ignorar execuções agendadas;
# Render Free tem outros limites e pode reiniciar serviços a qualquer momento.
name: Evolution API - ping externo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-api-uptime-probe
  cancel-in-progress: false

jobs:
  health-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar GET / da Evolution API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 \
            --max-time 80 \
            --retry 1 \
            --retry-delay 10 \
            --retry-all-errors \
            --user-agent "MBA-Labs-Evolution-Uptime/1.0" \
            --write-out "HTTP %{http_code} | Tempo %{time_total}s\\n" \
            "https://evolution-api-dhv5.onrender.com/"
