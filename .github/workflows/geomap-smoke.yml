name: GeoMap public photogrammetry smoke test
on:
  push:
    branches: [feat/geomap-phase-1]
    paths:
      - '.github/workflows/geomap-smoke.yml'
      - 'infra/geomap/ci-smoke.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geomap-public-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install independent GDAL validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin
          gdalinfo --version
          command -v gdal_translate
      - name: Run public fixture through NodeODM
        run: bash infra/geomap/ci-smoke.sh
      - name: Publish public sample results for review
        uses: actions/upload-artifact@v4
        with:
          name: geomap-public-result
          path: ${{ runner.temp }}/geomap-public-result/
          retention-days: 7
          if-no-files-found: error
