name: Elshaday Unsigned One-Off

on:
  push:
    branches:
      - build/elshaday-unsigned-1-0-2
    paths:
      - 'apps/igreja-android/**'
      - '.github/workflows/elshaday-unsigned-once.yml'
  workflow_dispatch:

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/igreja-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare signing tool for local secure signing
        run: |
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tool/apksigner.jar

      - name: List release outputs
        run: ls -lh app/build/outputs/apk/release/ signing-tool/

      - name: Upload unsigned APK and apksigner
        uses: actions/upload-artifact@v4
        with:
          name: elshaday-unsigned-1.0.2-with-signer
          path: |
            apps/igreja-android/app/build/outputs/apk/release/*.apk
            apps/igreja-android/signing-tool/apksigner.jar
          if-no-files-found: error
