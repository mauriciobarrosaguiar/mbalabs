name: Regenerate security lockfile

on:
  push:
    branches:
      - security/dependencies-20260812

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/dependencies-20260812
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate package lock from scratch
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Commit package-lock if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate package-lock from scratch after security overrides"
          git push origin HEAD:security/dependencies-20260812
