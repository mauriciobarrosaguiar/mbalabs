name: GeoMap report unit tests
on:
  push:
    branches: [feat/geomap-phase-1]
    paths:
      - 'apps/mba-labs-core/src/app/apps/geomap/**'
      - 'apps/mba-labs-core/tests/geomap-*.test.mjs'
      - 'infra/geomap/**'
      - '.github/workflows/geomap-unit.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --test apps/mba-labs-core/tests/geomap-*.test.mjs

      - run: bash -n infra/geomap/ci-smoke.sh
      - run: python3 -m unittest discover -s infra/geomap -p 'test_public_worker.py'
